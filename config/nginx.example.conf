server {
    listen 443 ssl http2;
    server_name tktknueva.example;
    root /var/www/tktknueva/public;
    index index.php;

    ssl_certificate     /etc/ssl/certs/tktknueva.crt;
    ssl_certificate_key /etc/ssl/private/tktknueva.key;

    location ^~ /data { deny all; }
    location ^~ /profiles { deny all; }
    location ^~ /uploads { deny all; }
    location ^~ /logs { deny all; }
    location ^~ /app { deny all; }
    location ^~ /config { deny all; }
    location ^~ /worker { deny all; }
    location ^~ /browser { deny all; }
    location ^~ /.env { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
